<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resta</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>

<header class="encabezado">
    <!-- 6. Nombre del proyecto cambiado -->
    <h1>Súper Calculadora Pro</h1>
    <nav class="menu">
        <a href="/suma">Suma</a>
        <a href="/resta">Resta</a>
        <a href="/multiplicacion">Multiplicación</a>
        <a href="/division">División</a>
        <!-- 5. Quinta ruta agregada al menú -->
        <a href="/residuo">Residuo</a>
    </nav>
</header>

<main class="contenedor">
    <section class="tarjeta-operacion">
        <h2>Resta</h2>
        <!-- 2. Texto explicativo agregado -->
        <p class="explicacion">Resta el segundo valor al primer valor para obtener la diferencia.</p>
        
        <form method="POST">
            <label for="numero1">Primer número</label>
            <input id="numero1" name="numero1" type="number" step="any" required>

            <label for="numero2">Segundo número</label>
            <input id="numero2" name="numero2" type="number" step="any" required>

            <!-- 3. Botón modificado con el símbolo -->
            <button class="boton" type="submit">
                Ejecutar ( - )
            </button>
        </form>

        {% if resultado is not none %}
            <p class="resultado">
                Resultado: {{ resultado }}
            </p>
        {% endif %}
    </section>
</main>
</body>
</html>
